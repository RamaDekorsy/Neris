<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto-Inmobiliaria</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
    
    </header>
     <nav class="navbar">
        <a href="index.html">Inicio</a> 
        <a href="productos.html">Productos</a> 
        <a href="contacto.html">Contacto</a>
    </nav>
    <section>
        <article>
            <h2>Informacion de contacto</h2>
            <p>Contactanos a tarves de los siguientes medios:</p>
            <ul>
                <li>Email: <a href="mailto:nerinievas@gmail.com">nerinievas@gmail.com</a> </li>
                <li>Telfeono: +542936406725</li>
            </ul>
        </article>

<article>
    <h2>Formulario de contacto</h2>
    <form id="formContacto">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="mensaje">Mensaje:</label>
        <textarea name="mensaje" id="mensaje" rows="4" required></textarea>
        <input type="submit">
    </form>
</article>

</form>

<script>
  document.getElementById("formContacto").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
      nombre: this.nombre.value,
      email: this.email.value,
      mensaje: this.mensaje.value
    };

    try {
      const res = await fetch("http://localhost:3000/contacto", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      const msg = await res.text();
      alert(msg);
    } catch (err) {
      alert("Error al enviar el mensaje");
      console.error(err);
    }
  });
</script>



    
    
</body>
</html>
