<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login Administrador</title>
  <style>
    body { font-family: Arial; padding: 50px; background-color: #f4f4f4; }
    form { max-width: 300px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    input, button { width: 100%; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <form onsubmit="return login()">
    <h2>Login de Administrador</h2>
    <input type="password" id="password" placeholder="Contraseña" required />
    <button type="submit">Ingresar</button>
    <p id="mensaje" style="color:red;"></p>
  </form>

  <script>
    function login() {
      const password = document.getElementById("password").value;
      if (password === "admin123") {
        window.location.href = "panel.html"; // acceso al panel
      } else {
        document.getElementById("mensaje").textContent = "Contraseña incorrecta.";
      }
      return false;
    }
  </script>
</body>
</html>
